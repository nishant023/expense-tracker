<!DOCTYPE html>
<html>
<head>
  <title>Expense Tracker</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-4">

  <h2>Expense Tracker</h2>

  <input type="number" id="amount" class="form-control mb-2" placeholder="Amount">
  <input type="text" id="description" class="form-control mb-2" placeholder="Description">
  <input type="text" id="category" class="form-control mb-2" placeholder="Category">
  <button onclick="addExpense()" class="btn btn-primary mb-3">Add Expense</button>

  <ul id="expenseList" class="list-group"></ul>

  <script src="script.js"></script>
</body>
</html>
